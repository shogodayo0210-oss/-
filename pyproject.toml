[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "firstprinciples"
version = "0.1.0"
description = "A first-principles decision protocol, with its own error bars. Analyses a decision; does not speak in anyone's voice."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = [
    "decision-making",
    "first-principles",
    "estimation",
    "calibration",
    "process",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fp = "firstprinciples.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
